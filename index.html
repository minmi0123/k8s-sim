<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쿠버네티스 회사 — 장면으로 보는 k8s</title>
<style>
  :root { --ink: #3d2c3a; --paper: #fbf6ea; --accent: #e8734a; --ok: #4f9a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #efe6d2; color: var(--ink); font-family: "Pretendard", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 1030px; margin: 0 auto; padding: 12px; }
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 17px; margin: 0 6px 0 0; }
  .scenes { display: flex; gap: 4px; flex-wrap: wrap; }
  .scenes button { font: inherit; font-size: 12px; padding: 3px 8px; border: 2px solid var(--ink); border-radius: 5px; background: #fff; color: var(--ink); }
  .scenes button.on { background: var(--ink); color: #fff; }
  .scenes button:disabled { opacity: .35; }
  .mode { margin-left: auto; display: flex; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
  .mode button { border: 0; background: #fff; color: var(--ink); padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .mode button.on { background: var(--ink); color: #fff; }
  .stage { position: relative; width: 100%; border: 3px solid var(--ink); border-radius: 4px; line-height: 0; }
  canvas { display: block; width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .tag, .bub { position: absolute; transform: translate(-50%, -100%); line-height: 1.25; white-space: nowrap; pointer-events: none; }
  .tag { font-size: 11px; padding: 1px 4px; background: rgba(255, 255, 255, .88); border: 1px solid var(--ink); border-radius: 3px; }
  .tag.room { font-weight: bold; background: rgba(255, 248, 230, .9); transform: translate(0, -100%); }
  .tag.pod { font-size: 10px; padding: 0 3px; border-color: #8a7a6a; }
  .bub { font-size: 12px; padding: 2px 6px; background: #fff3d6; border: 2px solid var(--accent); border-radius: 6px; font-weight: bold; animation: pop .25s ease-out; }
  .bub.ok { border-color: var(--ok); background: #e9f6ee; }
  .bub.no { border-color: #b8b0a8; background: #f2eeea; color: #8a7f78; }
  @keyframes pop { from { transform: translate(-50%, -80%) scale(.6); opacity: 0; } }
  .panel { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .say { flex: 1 1 440px; background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; padding: 8px 12px; min-height: 92px; }
  .say p { margin: 3px 0; font-size: 15px; }
  .meta { display: flex; gap: 10px; align-items: center; margin-top: 6px; font-size: 12px; color: #7a6a6a; flex-wrap: wrap; }
  .meta details { font-size: 12px; }
  .meta summary { cursor: pointer; }
  .meta details p { margin: 4px 0; max-width: 560px; color: var(--ink); }
  .choices { display: flex; gap: 6px; flex-wrap: wrap; }
  .choices:not(:empty) { margin: 8px 0 2px; }
  .choices button { font: inherit; font-size: 13px; padding: 4px 10px; border: 2px solid var(--accent); border-radius: 14px; background: #fff; color: var(--ink); cursor: pointer; }
  .choices button:hover { background: #fff3d6; }
  .ledger { flex: 0 1 330px; background: #fffdf5; border: 2px solid var(--ink); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  .ledger .lh { font-weight: bold; margin-bottom: 2px; }
  .ledger .lrs { font-size: 12px; color: #7a6a6a; margin-bottom: 4px; }
  .ledger table { width: 100%; border-collapse: collapse; }
  .ledger th, .ledger td { text-align: left; padding: 2px 4px; border-bottom: 1px dashed #d9cdb4; font-size: 12px; }
  .ledger tr.flash td { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: #ffe27a; } }
  .ctrl { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .ctrl button { font: inherit; font-size: 14px; padding: 6px 14px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; }
  .ctrl button.main { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold; }
  .ctrl button:disabled { opacity: .35; cursor: default; }
  .ctrl label { font-size: 13px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .ctrl .count { margin-left: auto; font-size: 12px; color: #7a6a6a; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>쿠버네티스 회사</h1>
    <div class="scenes" id="scenes"></div>
    <div class="mode" id="mode">
      <button data-mode="m" class="on">비유</button>
      <button data-mode="t">용어</button>
    </div>
  </header>

  <div class="stage" id="stage"><canvas id="cv" width="256" height="144"></canvas></div>

  <div class="ctrl">
    <button id="reset">처음부터</button>
    <button id="next" class="main">다음 ▶</button>
    <label><input type="checkbox" id="auto"> 자동 재생</label>
    <span class="count" id="count"></span>
  </div>

  <div class="panel">
    <div class="say">
      <div id="lines"></div>
      <div id="choices" class="choices"></div>
      <div class="meta">
        <span id="clock"></span>
        <details id="ref"><summary>근거</summary><p id="refText"></p><p><a id="refLink" target="_blank" rel="noopener"></a></p></details>
      </div>
    </div>
    <div class="ledger">
      <div class="lh" data-m="장부" data-t="etcd"></div>
      <div class="lrs" id="lrs"></div>
      <table><thead><tr><th data-m="이름" data-t="NAME"></th><th data-m="층" data-t="NODE"></th><th data-m="상태" data-t="STATUS"></th></tr></thead><tbody id="lt"></tbody></table>
    </div>
  </div>
</div>

<script>
'use strict';

// ===== 1. 도트 (dev-guide 도트.md 방식: 글자 1개 = 픽셀 1개) =====

const W = 256, H = 144;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const PALETTE = {
  o: '#3d2c3a', // 외곽선
  h: '#5a3a2a', // 머리카락
  s: '#f6cfae', // 피부
  c: '#f2a0a0', // 볼
  e: '#3d2c3a', // 눈
  m: '#c9645a', // 입
  t: '#8fb8e8', // 윗옷
  p: '#5a6a9a', // 바지
  b: '#5a4636', // 신발
  w: '#fffdf5', // 종이
  k: '#c4905a', // 나무
  i: '#e8434a', // 빨강 (느낌표·화살표)
};

function makeSprite(rows, colors = {}, flip = false) {
  const pal = { ...PALETTE, ...colors };
  const w = rows[0].length;
  rows.forEach((r, i) => { if (r.length !== w) console.warn('도트 줄 길이 다름', i, r); });
  const c = document.createElement('canvas');
  c.width = w;
  c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.' || !pal[ch]) return;
    g.fillStyle = pal[ch];
    g.fillRect(flip ? w - 1 - x : x, y, 1, 1);
  }));
  return c;
}

// 사람 12x17 (머리·몸 15줄 + 다리 2줄)
const TOP = [
  '...oooooo...',
  '..ohhhhhho..',
  '.ohhhhhhhho.',
  '.ohhsssshho.',
  '.osssssssso.',
  '.osesssseso.',
  '.osesssseso.',
  '.ocssmmssco.',
  '..osssssso..',
  '...oottoo...',
  '..otttttto..',
  '.otttttttto.',
  '.osttttttso.',
  '.osttttttso.',
  '..oppppppo..',
];
// 조는 얼굴: 눈을 가로 줄로
const SLEEP_TOP = TOP.map((r, i) => (i === 5 ? '.osssssssso.' : i === 6 ? '.osossssoso.' : r));
const LEGS = {
  stand: ['...op..po...', '...ob..bo...'],
  a:     ['..op....po..', '..ob....bo..'],
  b:     ['....oppo....', '....obbo....'],
};

function makePerson(colors, top = TOP) {
  const frames = (flip) => ({
    stand: makeSprite([...top, ...LEGS.stand], colors, flip),
    walk: [makeSprite([...top, ...LEGS.a], colors, flip), makeSprite([...top, ...LEGS.b], colors, flip)],
  });
  return { right: frames(false), left: frames(true) };
}

const LOOKS = {
  me:  { h: '#2f2a3a', t: '#f5b93a', p: '#46598f' },
  api: { h: '#7a4a2e', t: '#e8734a', p: '#5a4a6a' },
  rs:  { h: '#3a2a22', t: '#7cc27e', p: '#4f6a5a' },
  sch: { h: '#c9645a', t: '#c9a0e8', p: '#5a4a7a' },
  dep: { h: '#4a3428', t: '#5fb3b3', p: '#3d4a6a' },
  kub: { h: '#f5b93a', t: '#46598f', p: '#3d4a6a' }, // 노란 머리 = 안전모
  emp: [
    { h: '#5a3a2a', t: '#8fb8e8' }, { h: '#3a2a22', t: '#f29a9a' }, { h: '#a8693f', t: '#ffe27a' },
    { h: '#2f2a3a', t: '#9fd6c8' }, { h: '#7a4a2e', t: '#f7b6c8' }, { h: '#4a3428', t: '#c9c6d6' },
  ],
};

const SPR = {
  me: makePerson(LOOKS.me),
  api: makePerson(LOOKS.api),
  apiSleep: makePerson(LOOKS.api, SLEEP_TOP),
  rs: makePerson(LOOKS.rs),
  sch: makePerson(LOOKS.sch),
  dep: makePerson(LOOKS.dep),
  kub: makePerson(LOOKS.kub),
  emp: LOOKS.emp.map((l) => makePerson(l)),
  desk: makeSprite([
    'oooooooooooooooo',
    'okkkkkkkkkkkkkko',
    'oooooooooooooooo',
    '.oko........oko.',
    '.oko........oko.',
    '.ooo........ooo.',
  ]),
  env: makeSprite(['oooooo', 'oowwoo', 'owoowo', 'owwwwo', 'oooooo']),
  bang: makeSprite(['.ooo.', 'owiwo', 'owiwo', 'owwwo', 'owiwo', '.ooo.', '..o..']),
  zz: makeSprite(['ooooo', '...o.', '..o..', '.o...', 'ooooo']),
  arrow: makeSprite(['iiiii', '.iii.', '..i..']),
};

function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

function drawPerson(set, x, feet, { walking = false, dir = 'r', alpha = 1 } = {}) {
  const fr = set[dir === 'l' ? 'left' : 'right'];
  const img = walking ? fr.walk[Math.floor(T / 8) % 2] : fr.stand;
  ctx.globalAlpha = alpha;
  ctx.drawImage(img, Math.round(x), Math.round(feet - img.height + 1));
  ctx.globalAlpha = 1;
}

// ===== 2. 무대 (회사) =====

const ROOM_X = [8, 90, 172];      // 층(노드) 3개
const DESK_DX = [14, 38];         // 층마다 책상 2개 = 노드 용량
const DESK_FEET = 124;
const ROOMS = [
  { m: '1층', t: 'node-1' }, { m: '2층', t: 'node-2' }, { m: '3층', t: 'node-3' },
];
const NAMES = ['민지', '준호', '서연', '도윤', '하은', '지호', '수아', '예준', '지우', '시우', '유나', '건우'];
const RS_NAME = 'web-6d4f9c7b8';

let MODE = 'm';
const L = (o) => (o == null ? '' : typeof o === 'string' ? o : o[MODE]);

let S;      // 장면 상태
let gen = 0; // 처음부터를 누르면 올라감 → 진행 중이던 연출은 버려진다

function initState() {
  S = {
    A: {
      me:  { x: 226, feet: 58, dy: 0 },
      sch: { x: 12, feet: 58, dy: 0 },
      rs:  { x: 50, feet: 58, dy: 0 },
    },
    kub: ROOM_X.map((x0) => ({ x: x0 + 1, feet: 137, dy: 0 })),
    apiAwake: false,
    drawer: 0,
    rooms: ROOM_X.map(() => ({ win: false, taint: false })), // 창가 = 라벨, 공사 중 = taint
    pods: [], ledger: [], envs: [], rings: [], bangs: [],
    phase: 'idle', victim: null, fresh: null, target: null, plan: null, used: false,
  };
  SC.init();
  S.pods.forEach((p) => { p.state = 'run'; S.ledger.push({ id: p.id, node: p.node, st: 'run' }); });
}

// 층 n 에서 쓰고 있는 책상 칸 수 (종료 중인 직원도 자리를 차지한다)
const seated = (p) => p.node != null && (p.state === 'run' || p.state === 'term');
const occ = (n) => S.pods.filter((p) => p.node === n && seated(p)).reduce((s, p) => s + p.size, 0);
const deskTaken = (n, d, except) => S.pods.some((p) => p !== except && p.node === n && seated(p) && (p.desk === d || p.desk2 === d));
const freeDesks = (n, except) => [0, 1].filter((d) => !deskTaken(n, d, except));

let podSeq = 0;
function addPod(node, desk) {
  const used = new Set(S.pods.map((p) => p.mn));
  const free = NAMES.filter((n) => !used.has(n));
  const mn = free[Math.floor(Math.random() * free.length)];
  const sfx = Array.from({ length: 5 }, () => 'bcdfghjklmnpqrstvwxz2456789'[Math.floor(Math.random() * 27)]).join('');
  const p = {
    id: ++podSeq, mn, tn: `${RS_NAME}-${sfx}`, sfx, look: podSeq % LOOKS.emp.length,
    node, desk, desk2: null, size: 1, x: node == null ? 0 : deskX(node, desk), feet: DESK_FEET,
    state: 'none', alpha: 1, box: false, walking: false, dir: 'r',
  };
  S.pods.push(p);
  return p;
}
const deskX = (n, d) => ROOM_X[n] + DESK_DX[d] + 2;

const P = {
  me: () => [S.A.me.x + 6, S.A.me.feet - 20],
  rs: () => [S.A.rs.x + 6, S.A.rs.feet - 20],
  sch: () => [S.A.sch.x + 6, S.A.sch.feet - 20],
  dep: () => [S.A.dep.x + 6, S.A.dep.feet - 20],
  api: () => [126, 42],
  kub: (n) => [S.kub[n].x + 6, S.kub[n].feet - 20],
  drawer: () => [161, 41],
};

// ===== 3. 그리기 =====

function drawBG() {
  const o = PALETTE.o;
  rect(0, 0, W, 62, '#f3e6c8');               // 본사(컨트롤 플레인) 벽
  rect(0, 50, W, 12, '#e2cfa6');              // 본사 바닥
  rect(0, 50, W, 1, '#cdb68a');
  [[72, 8], [192, 8]].forEach(([x, y]) => {   // 창문
    rect(x - 1, y - 1, 22, 16, o); rect(x, y, 20, 14, '#bfe3f2');
    rect(x + 9, y, 2, 14, o); rect(x, y + 6, 20, 2, o);
  });
  rect(243, 25, 13, 34, o); rect(244, 26, 12, 33, '#a8693f'); rect(246, 42, 2, 2, '#f5b93a'); // 나 옆 문
  rect(0, 62, W, 6, '#b9a07a'); rect(0, 62, W, 1, o);
  rect(0, 68, W, H - 68, '#cdb68a');
  ROOM_X.forEach((x0, n) => {                 // 층(노드)
    rect(x0 - 1, 69, 78, 73, o); rect(x0, 70, 76, 71, '#efe2c6');
    rect(x0, 116, 76, 25, '#d8c099'); rect(x0, 116, 76, 1, '#c4a878');
    rect(x0 + 65, 95, 10, 21, o); rect(x0 + 66, 96, 8, 20, '#a8693f'); rect(x0 + 67, 105, 1, 2, '#f5b93a');
    const r = S.rooms[n];
    if (r.win) {                               // 창가 층 (라벨)
      rect(x0 + 29, 82, 20, 14, o); rect(x0 + 30, 83, 18, 12, '#bfe3f2');
      rect(x0 + 38, 83, 2, 12, o); rect(x0 + 30, 88, 18, 2, o);
    }
    if (r.taint) {                             // 공사 중 (taint): 위쪽 줄무늬 + 문에 X 테이프
      for (let x = 0; x < 76; x++) for (let y = 0; y < 3; y++) {
        rect(x0 + x, 70 + y, 1, 1, Math.floor((x + y) / 3) % 2 ? '#f5b93a' : '#3d2c3a');
      }
      for (let i = 0; i < 9; i++) {
        rect(x0 + 66 + i, 98 + i * 2, 1, 2, '#f5b93a');
        rect(x0 + 74 - i, 98 + i * 2, 1, 2, '#f5b93a');
      }
    }
  });
}

function drawCounter() {
  rect(103, 48, 48, 13, PALETTE.o);
  rect(104, 49, 46, 3, '#b07a5c');
  rect(104, 52, 46, 8, '#d9a877');
  rect(140, 46, 5, 2, PALETTE.o); rect(141, 45, 3, 1, '#f5b93a'); // 호출벨
}

function drawCabinet() {
  const o = PALETTE.o, x = 158, y = 30, w = 15;
  rect(x - 1, y - 1, w + 2, 31, o); rect(x, y, w, 29, '#c9c6d6');
  for (let i = 0; i < 3; i++) {
    const dy = y + 1 + i * 9;
    const out = S.drawer && i === 1 ? -5 : 0;   // 기록할 때 가운데 서랍이 열린다
    rect(x + 1 + out, dy, w - 2, 8, o); rect(x + 2 + out, dy + 1, w - 4, 6, '#e4e1ec');
    rect(x + 6 + out, dy + 3, 3, 1, o);
    if (out) { rect(x - 3, dy - 2, 5, 3, o); rect(x - 2, dy - 1, 3, 2, '#fffdf5'); }
  }
}

function drawRing(r) {
  ctx.globalAlpha = r.a;
  ctx.fillStyle = PALETTE.i;
  for (let a = 0; a < Math.PI * 2; a += 0.04) {
    ctx.fillRect(Math.round(126 + Math.cos(a) * r.r), Math.round(40 + Math.sin(a) * r.r * 0.75), 1, 1);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  drawBG();

  // 본사: 자리배치 담당 · 정원 담당 · 창구직원 · 장부 · 나
  const { me, sch, rs } = S.A;
  drawPerson(SPR.sch, sch.x, sch.feet + sch.dy);
  drawPerson(SPR.rs, rs.x, rs.feet + rs.dy);
  ctx.drawImage(SPR.desk, sch.x - 2, 51);
  ctx.drawImage(SPR.desk, rs.x - 2, 51);
  if (S.A.dep) {                    // 기획 담당은 장면 ③ 부터
    drawPerson(SPR.dep, S.A.dep.x, S.A.dep.feet + S.A.dep.dy);
    ctx.drawImage(SPR.desk, S.A.dep.x - 2, 51);
  }
  drawPerson(S.apiAwake ? SPR.api : SPR.apiSleep, 120, S.apiAwake ? 53 : 58);
  drawCounter();
  drawCabinet();
  drawPerson(SPR.me, me.x, me.feet + me.dy, { dir: 'l' });

  // 층: 직원(책상 뒤) → 책상 → 층 관리자
  S.pods.forEach((p) => {
    if (p.state === 'none' || p.state === 'gone') return;
    const shake = p.box && !p.walking && T % 24 < 12 ? 1 : 0;
    drawPerson(SPR.emp[p.look], p.x + shake, p.feet, { walking: p.walking, dir: p.dir, alpha: p.alpha });
  });
  ROOM_X.forEach((x0) => DESK_DX.forEach((dx) => ctx.drawImage(SPR.desk, x0 + dx, 119)));
  S.pods.forEach((p) => {           // 2칸 쓰는 직원: 옆 책상에 서류 더미
    if (p.desk2 == null || p.state !== 'run') return;
    const x = ROOM_X[p.node] + DESK_DX[p.desk2];
    ctx.globalAlpha = p.alpha;
    rect(x + 4, 113, 8, 7, PALETTE.o); rect(x + 5, 114, 6, 5, '#fffdf5');
    rect(x + 5, 116, 6, 1, '#c9c6d6'); rect(x + 6, 111, 5, 2, PALETTE.o);
    ctx.globalAlpha = 1;
  });
  S.pods.forEach((p) => {           // 짐 상자는 책상보다 앞에 (가려지지 않게)
    if (!p.box || p.state === 'none' || p.state === 'gone') return;
    const shake = !p.walking && T % 24 < 12 ? 1 : 0;
    ctx.globalAlpha = p.alpha;
    rect(p.x + 2 + shake, p.feet - 8, 9, 7, PALETTE.o); rect(p.x + 3 + shake, p.feet - 7, 7, 5, '#c4905a');
    rect(p.x + 3 + shake, p.feet - 5, 7, 1, PALETTE.o);
    ctx.globalAlpha = 1;
  });
  S.kub.forEach((k) => drawPerson(SPR.kub, k.x, k.feet + k.dy));

  // 클릭할 수 있는 직원 표시
  if (SC.clickPods && S.phase === 'idle') {
    const bob = Math.floor(T / 15) % 2;
    S.pods.filter((p) => p.state === 'run').forEach((p) => ctx.drawImage(SPR.arrow, p.x + 4, p.feet - 23 + bob));
  }

  // 조는 창구직원
  if (!S.apiAwake) {
    const k = (T % 90) / 90;
    ctx.globalAlpha = 1 - k;
    ctx.drawImage(SPR.zz, 133 + Math.round(k * 4), 38 - Math.round(k * 10));
    ctx.globalAlpha = 1;
  }

  S.rings.forEach(drawRing);
  S.envs.forEach((e) => ctx.drawImage(SPR.env, Math.round(e.x - 3), Math.round(e.y - 2)));

// ===== 6. 연출 도구 =====

let now = performance.now(), T = 0;
const tweens = [];
function tween(ms, fn) { return new Promise((res) => tweens.push({ t0: now, ms, fn, res })); }
const wait = (ms) => tween(ms, () => {});
const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2);

async function fly(from, to, ms = 800) {
  const e = { x: from[0], y: from[1] };
  S.envs.push(e);
  await tween(ms, (p) => {
    const q = ease(p);
    e.x = from[0] + (to[0] - from[0]) * q;
    e.y = from[1] + (to[1] - from[1]) * q - Math.sin(Math.PI * p) * 10;
  });
  S.envs.splice(S.envs.indexOf(e), 1);
}

function hop(a) { return tween(320, (p) => { a.dy = -Math.round(Math.sin(Math.PI * p) * 3); }); }

function bang(pos, ms = 1500) {
  const b = { x: pos[0], y: pos[1] };
  S.bangs.push(b);
  wait(ms).then(() => { const i = S.bangs.indexOf(b); if (i >= 0) S.bangs.splice(i, 1); });
}

// 창구가 서류를 받는다: 벌떡 일어나 검사 도장
async function receive(full) {
  S.apiAwake = true;
  await wait(250);
  const items = full
    ? [{ m: '신분 ✓', t: '인증 ✓' }, { m: '권한 ✓', t: '인가 ✓' }, { m: '양식 ✓', t: '어드미션 ✓' }]
    : [{ m: '검사 ✓', t: '인증·인가·어드미션 ✓' }];
  const xs = full ? [100, 126, 152] : [126];
  for (let i = 0; i < items.length; i++) {
    bubble(xs[i], 24, items[i], full ? 2600 : 1300, 'ok');
    await wait(full ? 500 : 400);
  }
}

// 장부에 적는다: 서랍이 열리고 표 줄이 반짝
async function record(change) {
  await fly([132, 42], P.drawer(), 450);
  S.drawer = 1;
  const changed = change();
  flash = changed == null ? [] : [].concat(changed);
  renderLedger();
  await wait(400);
  S.drawer = 0;
}

// 장부가 바뀌었다고 방송(watch) → 듣는 사람 머리 위에 !
async function broadcast(listeners) {
  const r = { r: 4, a: 1 };
  S.rings.push(r);
  await tween(750, (p) => { r.r = 4 + p * 80; r.a = 1 - p; });
  S.rings.splice(S.rings.indexOf(r), 1);
  listeners.forEach((pos) => bang(pos));
  await wait(500);
}

async function doze() { await wait(300); S.apiAwake = false; }

async function walk(p, toX, ms) {
  const x0 = p.x;
  p.walking = true;
  p.dir = toX < x0 ? 'l' : 'r';
  await tween(ms, (q) => { p.x = x0 + (toX - x0) * q; });
  p.walking = false;
}

// 거르기(필터) → 점수(남는 칸) → 최고점, 동점이면 무작위
function plan2(req) {
  const rooms = ROOM_X.map((_, n) => {
    const r = S.rooms[n], free = 2 - occ(n);
    const why = r.taint && !req.tol ? 'taint' : req.win && !r.win ? 'win' : free < req.size ? 'size' : null;
    return { n, why, tolPass: r.taint && req.tol, score: why ? null : free - req.size };
  });
  const cands = rooms.filter((r) => !r.why);
  const best = Math.max(...cands.map((r) => r.score));
  const top = cands.filter((r) => r.score === best);
  return { req, rooms, cands, target: top.length ? top[Math.floor(Math.random() * top.length)].n : null };
}

    await receive(false);
    await record(() => { S.ledger.push({ id: 'rs', kind: 'rs', ready: 0 }); return 'rs'; });
    await broadcast([P.rs()]);
    await doze();
  },
  async () => { // 3. 정원 담당 → 신입 3명 (로비 대기)
    bubble(S.A.rs.x + 6, 26, { m: '원함 3 / 실제 0', t: 'spec 3 / 실제 0' });
    await hop(S.A.rs);
    await wait(400);
    await fly(P.rs(), P.api(), 900);
    await receive(false);
    const fs = LOBBY3.map((x) => {
      const f = addPod(null, null);
      Object.assign(f, { x, feet: 58, dir: 'l', state: 'lobby', alpha: 0 });
      return f;
    });
    S.fresh3 = fs;
    await record(() => { fs.forEach((f) => S.ledger.push({ id: f.id, node: null, st: 'pend' })); return fs.map((f) => f.id); });
    await tween(300, (q) => fs.forEach((f) => { f.alpha = q; }));
    await broadcast([P.sch()]);
    await doze();
  },
  async () => { // 4. 한 명씩 자리 배치 → 바인딩
    const fs = S.fresh3, cnt = [0, 0, 0];
    await hop(S.A.sch);
    for (const f of fs) {
      const free = cnt.map((c, n) => 2 - occ(n) - c);
      const best = Math.max(...free);
      const top = free.map((v, n) => (v === best ? n : -1)).filter((n) => n >= 0);
      const n = top[Math.floor(Math.random() * top.length)];
      f.target = n;
      f.desk = freeDesks(n, f)[cnt[n]];
      cnt[n]++;
      bubble(ROOM_X[n] + 38, 100, { m: `✓ ${f.mn} 배정`, t: `✓ …${f.sfx}` }, Infinity, 'ok');
      await wait(450);
    }
    for (let i = 0; i < fs.length; i++) await fly(P.sch(), P.api(), 450);
    await receive(false);
    await record(() => {
      fs.forEach((f) => { f.node = f.target; Object.assign(entry(f.id), { node: f.target, st: 'crt' }); });
      return fs.map((f) => f.id);
    });
    await broadcast([...new Set(fs.map((f) => f.node))].map((n) => P.kub(n)));
    await doze();
  },
  async () => { // 5. 층 관리자: 매뉴얼 받기 → 앉히기 → 보고
    const fs = S.fresh3, used = [...new Set(fs.map((f) => f.node))];
    await Promise.all(used.map((n) => hop(S.kub[n])));
    used.forEach((n) => bubble(ROOM_X[n] + 38, 100, { m: '매뉴얼 v1 받는 중', t: 'pull web:v1' }, 1500, 'no'));
    await wait(1500);
    await tween(300, (q) => fs.forEach((f) => { f.alpha = 1 - q; }));
    fs.forEach((f) => Object.assign(f, { x: ROOM_X[f.node] + 62, feet: DESK_FEET, state: 'run', alpha: 1 }));
    await Promise.all(fs.map((f) => walk(f, deskX(f.node, f.desk), 1200)));
    fs.forEach((f) => { f.dir = 'r'; });
    await wait(200);
    await Promise.all(used.map((n, i) => wait(i * 150).then(() => fly(P.kub(n), P.api(), 900))));
    await receive(false);
    await record(() => { fs.forEach((f) => { entry(f.id).st = 'run'; }); return fs.map((f) => f.id); });
    await doze();
  },
  async () => { // 6. 정원표 · 계획서 status 갱신
    await hop(S.A.rs);
    await fly(P.rs(), P.api(), 900);
    await receive(false);
    await record(() => { entry('rs').ready = 3; return 'rs'; });
    await hop(S.A.dep);
    await fly(P.dep(), P.api(), 900);
    await receive(false);
    await record(() => { entry('dep').ready = 3; return 'dep'; });
    await doze();
    bubble(S.A.dep.x + 6, 26, { m: '계획 완료 3/3 ✓', t: 'READY 3/3 ✓' }, Infinity, 'ok');
  },
];

const SCENE3 = {
  clickPods: false,
  sub: { m: '장부는 창구직원만 씀 · └ = 누구 소속인지', t: 'etcd는 apiserver만 씀 · └ = ownerReferences' },
  choices: [{ m: '영업팀 운영 계획서 제출', t: 'kubectl apply -f web.yaml' }],
  plan: () => ({}),
  init() { S.A.dep = { x: 86, feet: 58, dy: 0 }; },
  steps: () => STEPS3,
  run: RUN3,
};

let SC = SCENE1;

// ===== 8. 진행 =====

let cur = 0, busy = false;
const $ = (id) => document.getElementById(id);

function say(i) {
  const steps = SC.steps(), s = steps[i];
  $('lines').innerHTML = '';
  s[MODE].forEach((line) => { const p = document.createElement('p'); p.textContent = line; $('lines').appendChild(p); });
  $('clock').textContent = s.clock ? `⏱ ${s.clock}` : '';
  $('refText').textContent = s.ref;
  $('refLink').href = s.url;
  $('refLink').textContent = s.url.replace('https://', '');
  $('count').textContent = i === 0 ? '' : `${i} / ${steps.length - 1}`;
}

const lastStep = () => SC.steps().length - 1;

function updBtns() {
  $('next').disabled = busy || cur === 0 || cur >= lastStep();
}

// 장면 ② 처럼 고르는 장면: 기다리는 동안 선택 칩을 보여 준다
function renderChoices() {
  const box = $('choices');
  box.innerHTML = '';
  if (!SC.choices || S.phase !== 'idle') return;
  SC.choices.forEach((c) => {
    const b = document.createElement('button');
    b.dataset.m = c.m; b.dataset.t = c.t;
    b.textContent = L(c);
    b.addEventListener('click', () => choose(c));
    box.appendChild(b);
  });
}

function choose(c) {
  if (S.phase !== 'idle') return;
  if (S.used) reset();
  S.used = true;
  S.plan = SC.plan(c);
  S.plan.choice = { m: c.m, t: c.t };
  S.phase = 'run';
  renderChoices();
  runStep(1);
}

async function runStep(i) {
  const g = gen;
  cur = i;
  say(i);
  clearBubbles();
  busy = true; updBtns();
  await SC.run[i]();
  if (g !== gen) return;
  busy = false;
  if (i === lastStep()) { S.phase = 'idle'; updBtns(); renderChoices(); return; }
  updBtns();
  if ($('auto').checked) {
    await wait(1500);
    if (g === gen && cur === i && !busy) next();
  }
}

function next() { if (!busy && cur >= 1 && cur < lastStep()) runStep(cur + 1); }

function reset() {
  gen++;
  tweens.length = 0;
  clearBubbles(true);
  podTags.forEach((el) => el.remove()); podTags.clear();
  initState();
  refreshRoomTags();
  Object.assign($('lrs').dataset, SC.sub);
  $('lrs').textContent = L(SC.sub);
  renderLedger();
  cur = 0; busy = false;
  say(0); updBtns(); renderChoices();
}

function podAt(x, y) {
  if (!SC.clickPods) return null;
  return S.pods.find((p) => p.state === 'run' && x >= p.x && x < p.x + 12 && y >= p.feet - 17 && y <= p.feet);
}
function toCanvas(e) { return [(e.offsetX / cv.clientWidth) * W, (e.offsetY / cv.clientHeight) * H]; }

function clickPod(p) {
  if (S.phase !== 'idle' || !p || p.state !== 'run') return;
  clearBubbles();
  S.phase = 'run';
  S.victim = p;
  S.fresh = null;
  runStep(1);
}

cv.addEventListener('click', (e) => clickPod(podAt(...toCanvas(e))));
cv.addEventListener('mousemove', (e) => { cv.style.cursor = S.phase === 'idle' && podAt(...toCanvas(e)) ? 'pointer' : 'default'; });
$('next').addEventListener('click', next);
$('reset').addEventListener('click', reset);
$('auto').addEventListener('change', () => { if ($('auto').checked) next(); });

// ===== 9. 비유 / 용어 =====

function setMode(m) {
  MODE = m;
  document.querySelectorAll('#mode button').forEach((b) => b.classList.toggle('on', b.dataset.mode === m));
  document.querySelectorAll('[data-m]').forEach((el) => { el.textContent = el.dataset[m]; });
  podTags.forEach((el, id) => { const p = S.pods.find((q) => q.id === id); if (p) el.textContent = m === 'm' ? p.mn : `…${p.sfx}`; });
  say(cur);
  renderLedger();
}
document.querySelectorAll('#mode button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

const SCENES = [
  { m: '① 퇴사 → 재채용', t: '① Pod 삭제 → 재생성', sc: SCENE1 },
  { m: '② 신입 자리 배치', t: '② 스케줄링', sc: SCENE2 },
  { m: '③ 채용 요청서 따라가기', t: '③ apply → Pod 실행', sc: SCENE3 },
  { m: '④ 층 정전', t: '④ 노드 장애' },
  { m: '⑤ 책상 크기 초과', t: '⑤ limits · OOMKilled' },
  { m: '⑥ 업무 매뉴얼 개정', t: '⑥ 롤링 업데이트' },
  { m: '⑦ 대표번호 연결', t: '⑦ Service' },
];
function switchScene(sc) {
  SC = sc;
  SCENES.forEach((s) => s.btn.classList.toggle('on', s.sc === sc));
  reset();
}
SCENES.forEach((s) => {
  const b = document.createElement('button');
  b.dataset.m = s.m; b.dataset.t = s.t;
  b.textContent = s.m;
  s.btn = b;
  if (s.sc) b.addEventListener('click', () => { if (SC !== s.sc) switchScene(s.sc); });
  else { b.disabled = true; b.title = '준비 중'; }
  $('scenes').appendChild(b);
});
SCENES[0].btn.classList.add('on');

// ===== 10. 루프 =====

function frame(ts) {
  now = ts; T++;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i];
    const p = Math.min(1, (now - w.t0) / w.ms);
    w.fn(p);
    if (p >= 1) { tweens.splice(i, 1); w.res(); }
  }
  bubbles = bubbles.filter((b) => { if (now > b.until) { b.d.remove(); return false; } return true; });
  draw();
  updateTags();
  requestAnimationFrame(frame);
}

reset();
setMode('m');
requestAnimationFrame(frame);

window.sim = {
  get S() { return S; }, setMode, next, reset, clickPod, choose, CHOICES2,
  scene: (i) => switchScene(SCENES[i - 1].sc), get cur() { return cur; }, get busy() { return busy; },
};
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쿠버네티스 회사 — 장면으로 보는 k8s</title>
<style>
  :root { --ink: #3d2c3a; --paper: #fbf6ea; --accent: #e8734a; --ok: #4f9a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #efe6d2; color: var(--ink); font-family: "Pretendard", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 1030px; margin: 0 auto; padding: 12px; }
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 17px; margin: 0 6px 0 0; }
  /* 장면 탭은 늘 둘째 줄 한 줄 — 비유/용어로 글 길이가 바뀌어도 머리 틀은 그대로. 넘치면 옆으로 넘김 */
  .scenes { order: 3; width: 100%; display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .scenes::-webkit-scrollbar { display: none; }
  .scenes button { flex: none; font: inherit; font-size: 12px; padding: 3px 8px; border: 2px solid var(--ink); border-radius: 5px; background: #fff; color: var(--ink); }
  .scenes button.on { background: var(--ink); color: #fff; }
  .scenes button:disabled { opacity: .35; }
  .mode { display: flex; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
  .mode button { border: 0; background: #fff; color: var(--ink); padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .mode button.on { background: var(--ink); color: #fff; }
  .stage { position: relative; width: 100%; border: 3px solid var(--ink); border-radius: 4px; line-height: 0; }
  canvas { display: block; width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .tag, .bub { position: absolute; transform: translate(-50%, -100%); line-height: 1.25; white-space: nowrap; pointer-events: none; }
  .tag { font-size: 11px; padding: 1px 4px; background: rgba(255, 255, 255, .88); border: 1px solid var(--ink); border-radius: 3px; }
  .tag.room { font-weight: bold; background: rgba(255, 248, 230, .9); transform: translate(0, -100%); }
  .tag.pod { font-size: 10px; padding: 0 3px; border-color: #8a7a6a; }
  .bub { font-size: 12px; padding: 2px 6px; background: #fff3d6; border: 2px solid var(--accent); border-radius: 6px; font-weight: bold; animation: pop .25s ease-out; }
  .bub.ok { border-color: var(--ok); background: #e9f6ee; }
  .bub.no { border-color: #b8b0a8; background: #f2eeea; color: #8a7f78; }
  @keyframes pop { from { transform: translate(-50%, -80%) scale(.6); opacity: 0; } }
  .panel { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .say { flex: 1 1 440px; background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; padding: 8px 12px; min-height: 92px; }
  .say p { margin: 3px 0; font-size: 15px; }
  .meta { display: flex; gap: 10px; align-items: center; margin-top: 6px; font-size: 12px; color: #7a6a6a; flex-wrap: wrap; }
  .meta details { font-size: 12px; }
  .meta summary { cursor: pointer; }
  .meta details p { margin: 4px 0; max-width: 560px; color: var(--ink); }
  .choices { display: flex; gap: 6px; flex-wrap: wrap; }
  .choices:not(:empty) { margin: 8px 0 2px; }
  .choices button { font: inherit; font-size: 13px; padding: 4px 10px; border: 2px solid var(--accent); border-radius: 14px; background: #fff; color: var(--ink); cursor: pointer; }
  .choices button:hover { background: #fff3d6; }
  .ledger { flex: 0 1 330px; background: #fffdf5; border: 2px solid var(--ink); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  .ledger .lh { font-weight: bold; margin-bottom: 2px; }
  .ledger .lrs { font-size: 12px; color: #7a6a6a; margin-bottom: 4px; }
  .ledger { overflow-x: auto; }
  .ledger table { width: 100%; border-collapse: collapse; }
  .ledger td { white-space: nowrap; }
  .ledger th, .ledger td { text-align: left; padding: 2px 4px; border-bottom: 1px dashed #d9cdb4; font-size: 12px; }
  .ledger tr.flash td { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: #ffe27a; } }
  .ledger tr.flash-loop td { animation: flash 1.4s ease-out infinite; }
  .ctrl { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .ctrl button { font: inherit; font-size: 14px; padding: 6px 14px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; }
  .ctrl button.main { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold; }
  .ctrl button:disabled { opacity: .35; cursor: default; }
  .ctrl label { font-size: 13px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .ctrl .count { margin-left: auto; font-size: 12px; color: #7a6a6a; }
  [hidden] { display: none !important; }
  .nav { margin-left: auto; display: flex; gap: 4px; }
  .nav button { font: inherit; font-size: 12px; padding: 3px 8px; border: 2px solid var(--ink); border-radius: 5px; background: #fff; color: var(--ink); cursor: pointer; }
  .tag .short { display: none; }

  /* 처음 화면 · 도감 — 장면 화면과 같은 색 */
  .screen { max-width: 520px; margin: 0 auto; min-height: 100vh; }
  #home { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 18px; text-align: center; }
  #home .ttl { font-size: 27px; letter-spacing: -1px; margin: 0 0 6px; color: var(--ink); text-shadow: 3px 3px 0 #e2cfa6; }
  #home .tagline { font-size: 12.5px; color: #7a6a6a; margin-bottom: 20px; }
  #titleCv { width: 100%; max-width: 360px; border: 3px solid var(--ink); border-radius: 4px; margin-bottom: 22px; image-rendering: pixelated; image-rendering: crisp-edges; }
  #home .menu { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px; }
  #home .menu button { border: 2px solid var(--ink); border-radius: 6px; background: #fff; color: var(--ink); padding: 13px; font: inherit; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 var(--ink); }
  #home .menu button.main { background: var(--accent); color: #fff; }
  #home .menu button .s { display: block; font-size: 11px; font-weight: normal; color: #7a6a6a; margin-top: 3px; }
  #home .menu button.main .s { color: #fff3d6; }
  @media (hover: hover) { #home .menu button:hover { background: #fff3d6; } #home .menu button.main:hover { background: #ef8a62; } }
  #home .menu button:active { transform: translateY(4px); box-shadow: none; }
  #dex { max-width: 760px; padding: 0 14px 30px; }
  .dexhead { position: sticky; top: 0; background: #efe6d2; padding: 10px 0 8px; border-bottom: 2px solid var(--ink); z-index: 2; }
  .dexhead .row { display: flex; align-items: center; gap: 10px; }
  .dexhead h2 { font-size: 18px; margin: 0; color: var(--ink); }
  .dexhead .cnt { margin-left: auto; font-size: 12px; color: #7a6a6a; }
  .dexhead button, .dexit .scs button { font: inherit; border: 2px solid var(--ink); border-radius: 5px; background: #fff; color: var(--ink); cursor: pointer; }
  .dexhead .row button { font-size: 13px; padding: 4px 10px; }
  .dexnav { display: flex; gap: 4px; margin-top: 8px; }
  .dexnav button { font-size: 13px; padding: 3px 12px; }
  .dexnav button.on { background: var(--ink); color: #fff; }
  #dex h3 { font-size: 14px; color: #7a6a6a; margin: 18px 0 8px; }
  .dexlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 6px; }
  .dexit { display: flex; gap: 10px; align-items: flex-start; border: 2px solid var(--ink); border-radius: 6px; background: var(--paper); padding: 7px 8px; }
  .dexit .art { flex: none; width: 72px; height: 60px; background: #f3e6c8; border: 2px solid var(--ink); border-radius: 3px; image-rendering: pixelated; image-rendering: crisp-edges; }
  .dexit .nm { font-weight: bold; font-size: 15px; color: var(--ink); }
  .dexit .tm { font-size: 12px; color: var(--accent); font-weight: bold; }
  .dexit .ds { font-size: 13px; line-height: 1.45; margin-top: 3px; }
  .dexit .scs { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; font-size: 11px; color: #7a6a6a; align-items: center; }
  .dexit .scs button { font-size: 12px; padding: 0 5px; }
  @media (hover: hover) { .dexhead button:not(.on):hover, .dexit .scs button:hover { background: #fff3d6; } }

  /* 폰: 장면 탭은 옆으로 넘기는 한 줄, 이름표는 작고 짧게 */
  @media (max-width: 700px) {
    .wrap { padding: 8px; }
    h1 { font-size: 15px; }
    .tag { font-size: 8px; padding: 0 2px; }
    .tag.pod { font-size: 7px; padding: 0 2px; }
    .tag .full { display: none; }
    .tag .short { display: inline; }
    .bub { font-size: 10px; padding: 1px 4px; border-width: 1.5px; }
    .say p { font-size: 14px; }
    .ctrl button { padding: 6px 10px; }
    .dexlist { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="home" class="screen">
  <h2 class="ttl">쿠버네티스 회사</h2>
  <div class="tagline">장면으로 보는 쿠버네티스</div>
  <canvas id="titleCv" width="160" height="120"></canvas>
  <div class="menu">
    <button id="goStart" class="main">시작하기<span class="s" id="startSub"></span></button>
    <button id="goDex">도감<span class="s" id="dexSub"></span></button>
  </div>
</div>

<div id="dex" class="screen" hidden>
  <div class="dexhead">
    <div class="row"><button id="dexBack">← 돌아가기</button><h2>용어 도감</h2><span class="cnt" id="dexCount"></span></div>
    <div class="dexnav" id="dexNav"></div>
  </div>
  <div id="dexBody"></div>
</div>

<div class="wrap" id="simScreen" hidden>
  <header>
    <h1>쿠버네티스 회사</h1>
    <div class="scenes" id="scenes"></div>
    <div class="nav">
      <button id="toHome" title="처음 화면">⌂ 처음</button>
      <button id="toDex">도감</button>
    </div>
    <div class="mode" id="mode">
      <button data-mode="m" class="on">비유</button>
      <button data-mode="t">용어</button>
    </div>
  </header>

  <div class="stage" id="stage"><canvas id="cv" width="256" height="144"></canvas></div>

  <div class="ctrl">
    <button id="reset">처음부터</button>
    <button id="next" class="main">다음 ▶</button>
    <button id="replay" title="지금 단계를 처음부터 다시 봄">↺ 다시보기</button>
    <label><input type="checkbox" id="auto"> 자동 재생</label>
    <span class="count" id="count"></span>
  </div>

  <div class="panel">
    <div class="say">
      <div id="lines"></div>
      <div id="choices" class="choices"></div>
      <div class="meta">
        <span id="clock"></span>
        <details id="ref"><summary>근거</summary><p id="refText"></p><p><a id="refLink" target="_blank" rel="noopener"></a></p></details>
      </div>
    </div>
    <div class="ledger">
      <div class="lh" data-m="장부" data-t="etcd"></div>
      <div class="lrs" id="lrs"></div>
      <table><thead><tr><th data-m="이름" data-t="NAME"></th><th data-m="층" data-t="NODE"></th><th data-m="상태" data-t="STATUS"></th></tr></thead><tbody id="lt"></tbody></table>
    </div>
  </div>
</div>

<script>
'use strict';

// ===== 1. 도트 (dev-guide 도트.md 방식: 글자 1개 = 픽셀 1개) =====

const W = 256, H = 144;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const PALETTE = {
  o: '#3d2c3a', // 외곽선
  h: '#5a3a2a', // 머리카락
  s: '#f6cfae', // 피부
  c: '#f2a0a0', // 볼
  e: '#3d2c3a', // 눈
  m: '#c9645a', // 입
  t: '#8fb8e8', // 윗옷
  p: '#5a6a9a', // 바지
  b: '#5a4636', // 신발
  w: '#fffdf5', // 종이
  k: '#c4905a', // 나무
  i: '#e8434a', // 빨강 (느낌표·화살표)
};

function makeSprite(rows, colors = {}, flip = false) {
  const pal = { ...PALETTE, ...colors };
  const w = rows[0].length;
  rows.forEach((r, i) => { if (r.length !== w) console.warn('도트 줄 길이 다름', i, r); });
  const c = document.createElement('canvas');
  c.width = w;
  c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.' || !pal[ch]) return;
    g.fillStyle = pal[ch];
    g.fillRect(flip ? w - 1 - x : x, y, 1, 1);
  }));
  return c;
}

// 사람 12x17 (머리·몸 15줄 + 다리 2줄)
const TOP = [
  '...oooooo...',
  '..ohhhhhho..',
  '.ohhhhhhhho.',
  '.ohhsssshho.',
  '.osssssssso.',
  '.osesssseso.',
  '.osesssseso.',
  '.ocssmmssco.',
  '..osssssso..',
  '...oottoo...',
  '..otttttto..',
  '.otttttttto.',
  '.osttttttso.',
  '.osttttttso.',
  '..oppppppo..',
];
// 조는 얼굴: 눈을 가로 줄로
const SLEEP_TOP = TOP.map((r, i) => (i === 5 ? '.osssssssso.' : i === 6 ? '.osossssoso.' : r));
const LEGS = {
  stand: ['...op..po...', '...ob..bo...'],
  a:     ['..op....po..', '..ob....bo..'],
  b:     ['....oppo....', '....obbo....'],
};

function makePerson(colors, top = TOP) {
  const frames = (flip) => ({
    stand: makeSprite([...top, ...LEGS.stand], colors, flip),
    walk: [makeSprite([...top, ...LEGS.a], colors, flip), makeSprite([...top, ...LEGS.b], colors, flip)],
  });
  return { right: frames(false), left: frames(true) };
}

const LOOKS = {
  me:  { h: '#2f2a3a', t: '#f5b93a', p: '#46598f' },
  api: { h: '#7a4a2e', t: '#e8734a', p: '#5a4a6a' },
  rs:  { h: '#3a2a22', t: '#7cc27e', p: '#4f6a5a' },
  sch: { h: '#c9645a', t: '#c9a0e8', p: '#5a4a7a' },
  dep: { h: '#4a3428', t: '#5fb3b3', p: '#3d4a6a' },
  nc:  { h: '#2f2a3a', t: '#a8c66c', p: '#4f6a5a' },
  kub: { h: '#f5b93a', t: '#46598f', p: '#3d4a6a' }, // 노란 머리 = 안전모
  ep:  { h: '#5a3a2a', t: '#e89ac8', p: '#5a4a6a' },
  emp: [
    { h: '#5a3a2a', t: '#8fb8e8' }, { h: '#3a2a22', t: '#f29a9a' }, { h: '#a8693f', t: '#ffe27a' },
    { h: '#2f2a3a', t: '#9fd6c8' }, { h: '#7a4a2e', t: '#f7b6c8' }, { h: '#4a3428', t: '#c9c6d6' },
  ],
};

const SPR = {
  me: makePerson(LOOKS.me),
  api: makePerson(LOOKS.api),
  apiSleep: makePerson(LOOKS.api, SLEEP_TOP),
  rs: makePerson(LOOKS.rs),
  sch: makePerson(LOOKS.sch),
  dep: makePerson(LOOKS.dep),
  nc: makePerson(LOOKS.nc),
  ep: makePerson(LOOKS.ep),
  phone: makeSprite(['.ooooo.', 'oiiiiio', 'oio.oio', 'oo...oo']),
  heart: makeSprite(['.i.i.', 'iiiii', '.iii.', '..i..']),
  kub: makePerson(LOOKS.kub),
  emp: LOOKS.emp.map((l) => makePerson(l)),
  empSleep: LOOKS.emp.map((l) => makePerson(l, SLEEP_TOP)),
  desk: makeSprite([
    'oooooooooooooooo',
    'okkkkkkkkkkkkkko',
    'oooooooooooooooo',
    '.oko........oko.',
    '.oko........oko.',
    '.ooo........ooo.',
  ]),
  env: makeSprite(['oooooo', 'oowwoo', 'owoowo', 'owwwwo', 'oooooo']),
  bang: makeSprite(['.ooo.', 'owiwo', 'owiwo', 'owwwo', 'owiwo', '.ooo.', '..o..']),
  zz: makeSprite(['ooooo', '...o.', '..o..', '.o...', 'ooooo']),
  arrow: makeSprite(['iiiii', '.iii.', '..i..']),
};

function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

function drawPerson(set, x, feet, { walking = false, dir = 'r', alpha = 1 } = {}) {
  const fr = set[dir === 'l' ? 'left' : 'right'];
  const img = walking ? fr.walk[Math.floor(T / 8) % 2] : fr.stand;
  ctx.globalAlpha = alpha;
  ctx.drawImage(img, Math.round(x), Math.round(feet - img.height + 1));
  ctx.globalAlpha = 1;
}

// ===== 2. 무대 (회사) =====

const ROOM_X = [8, 90, 172];      // 층(노드) 3개
const DESK_DX = [14, 38];         // 층마다 책상 2개 = 노드 용량
const DESK_FEET = 124;
const ROOMS = [
  { m: '1층', t: 'node-1' }, { m: '2층', t: 'node-2' }, { m: '3층', t: 'node-3' },
];
const NAMES = ['민지', '준호', '서연', '도윤', '하은', '지호', '수아', '예준', '지우', '시우', '유나', '건우'];
const RS_NAME = 'web-6d4f9c7b8';

let MODE = 'm';
const L = (o) => (o == null ? '' : typeof o === 'string' ? o : o[MODE]);

let S;      // 장면 상태
let gen = 0; // 처음부터를 누르면 올라감 → 진행 중이던 연출은 버려진다

// 난수는 씨앗에서 뽑는다 → 다시보기 때 같은 씨앗으로 돌리면 같은 결과(같은 층·같은 이름)가 나온다
let seed = Date.now() | 0;
function rnd() {
  seed = (seed + 0x6D2B79F5) | 0;
  let t = seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function initState() {
  S = {
    A: {
      me:  { x: 226, feet: 58, dy: 0 },
      sch: { x: 12, feet: 58, dy: 0 },
      rs:  { x: 50, feet: 58, dy: 0 },
    },
    kub: ROOM_X.map((x0) => ({ x: x0 + 1, feet: 137, dy: 0 })),
    apiAwake: false,
    drawer: 0,
    rooms: ROOM_X.map(() => ({ win: false, taint: false })), // 창가 = 라벨, 공사 중 = taint
    pods: [], ledger: [], envs: [], rings: [], bangs: [], hearts: [], calls: [],
    names: new Set(),
    phase: 'idle', victim: null, fresh: null, target: null, plan: null, used: false,
  };
  SC.init();
  S.pods.forEach((p) => { p.state = 'run'; if (!p.noLedger) S.ledger.push({ id: p.id, node: p.node, st: 'run', rs: p.rs }); });
}

// 층 n 에서 쓰고 있는 책상 칸 수 (종료 중인 직원도 자리를 차지한다)
const seated = (p) => p.node != null && (p.state === 'run' || p.state === 'term');
const occ = (n) => S.pods.filter((p) => p.node === n && seated(p)).reduce((s, p) => s + p.size, 0);
const deskTaken = (n, d, except) => S.pods.some((p) => p !== except && p.node === n && seated(p) && (p.desk === d || p.desk2 === d));
const freeDesks = (n, except) => [0, 1].filter((d) => !deskTaken(n, d, except));

let podSeq = 0;
function addPod(node, desk) {
  const used = new Set(S.pods.map((p) => p.mn));   // 떠난 직원 이름도 한 판에선 다시 안 씀 (다 쓰면 지금 있는 사람만 피함)
  let free = NAMES.filter((n) => !used.has(n) && !S.names.has(n));
  if (!free.length) free = NAMES.filter((n) => !used.has(n));
  const mn = free[Math.floor(rnd() * free.length)];
  const sfx = Array.from({ length: 5 }, () => 'bcdfghjklmnpqrstvwxz2456789'[Math.floor(rnd() * 27)]).join('');
  S.names.add(mn);
  const p = {
    id: ++podSeq, mn, tn: `${RS_NAME}-${sfx}`, sfx, look: podSeq % LOOKS.emp.length,
    node, desk, desk2: null, size: 1, x: node == null ? 0 : deskX(node, desk), feet: DESK_FEET,
    state: 'none', alpha: 1, box: false, walking: false, dir: 'r',
  };
  S.pods.push(p);
  return p;
}
const deskX = (n, d) => ROOM_X[n] + DESK_DX[d] + 2;

const P = {
  me: () => [S.A.me.x + 6, S.A.me.feet - 20],
  rs: () => [S.A.rs.x + 6, S.A.rs.feet - 20],
  sch: () => [S.A.sch.x + 6, S.A.sch.feet - 20],

// 전화 신호: 지나간 길은 점선, 머리는 수화기
function pathAt(pts, p) {
  const seg = pts.length - 1, t = Math.min(seg - 1e-6, p * seg), i = Math.floor(t), q = t - i;
  return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * q, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * q];
}
function drawCall(pts, p) {
  for (let k = 0; k <= 120 && k / 120 <= p; k += 2) { const [x, y] = pathAt(pts, k / 120); rect(x, y, 1, 1, '#e8734a'); }
  const [x, y] = pathAt(pts, p);
  ctx.drawImage(SPR.phone, Math.round(x - 3), Math.round(y - 2));
}

function drawRing(r) {
  ctx.globalAlpha = r.a;
  ctx.fillStyle = PALETTE.i;
  for (let a = 0; a < Math.PI * 2; a += 0.04) {
    ctx.fillRect(Math.round(126 + Math.cos(a) * r.r), Math.round(40 + Math.sin(a) * r.r * 0.75), 1, 1);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  drawBG();

    ctx.drawImage(SPR.desk, S.A.dep.x - 2, 51);

    drawPerson(SPR.ep, S.A.ep.x, S.A.ep.feet + S.A.ep.dy);
    ctx.drawImage(SPR.desk, S.A.ep.x - 2, 51);
  }

    drawPerson(SPR.nc, S.A.nc.x, S.A.nc.feet + S.A.nc.dy);
    ctx.drawImage(SPR.desk, S.A.nc.x - 2, 51);
  }
  drawPerson(S.apiAwake ? SPR.api : SPR.apiSleep, 120, S.apiAwake ? 53 : 58);
  drawCounter();
  drawCabinet();
  drawPerson(SPR.me, me.x, me.feet + me.dy, { dir: 'l' });

  // 층: 직원(책상 뒤) → 책상 → 층 관리자
  S.pods.forEach((p) => {
    if (p.state === 'none' || p.state === 'gone') return;
    const shake = p.box && !p.walking && T % 24 < 12 ? 1 : 0;
    if (p.sink) {                   // 쓰러짐: 책상 뒤로 가라앉고, 책상 아래로는 안 보이게

  ROOM_X.forEach((x0) => DESK_DX.forEach((dx) => ctx.drawImage(SPR.desk, x0 + dx, 119)));
  S.pods.forEach((p) => {           // 2칸 쓰는 직원: 옆 책상에 서류 더미

    ctx.globalAlpha = p.alpha;
    rect(x + 4, 113, 8, 7, PALETTE.o); rect(x + 5, 114, 6, 5, '#fffdf5');
    rect(x + 5, 116, 6, 1, '#c9c6d6'); rect(x + 6, 111, 5, 2, PALETTE.o);
    ctx.globalAlpha = 1;
  });
  S.pods.forEach((p) => {           // 짐 상자는 책상보다 앞에 (가려지지 않게)
    if (!p.box || p.state === 'none' || p.state === 'gone') return;
    const shake = !p.walking && T % 24 < 12 ? 1 : 0;
    ctx.globalAlpha = p.alpha;
    rect(p.x + 2 + shake, p.feet - 8, 9, 7, PALETTE.o); rect(p.x + 3 + shake, p.feet - 7, 7, 5, '#c4905a');
    rect(p.x + 3 + shake, p.feet - 5, 7, 1, PALETTE.o);
    ctx.globalAlpha = 1;
  });
  S.pods.forEach((p) => {           // 장면 ⑥: 책상 위 매뉴얼 (색 = 판)
    if (!p.ver || p.box || p.node == null || p.state !== 'run') return;
    ctx.globalAlpha = p.alpha;
    rect(p.x + 8, p.feet - 9, 5, 4, PALETTE.o); rect(p.x + 9, p.feet - 8, 3, 2, VER_COL[p.ver]);
    ctx.globalAlpha = 1;
  });
  S.kub.forEach((k) => drawPerson(SPR.kub, k.x, k.feet + k.dy));
  ROOM_X.forEach((x0, n) => {       // 정전된 층은 어둡게
    const d = S.rooms[n].dark;
    if (!d) return;
    ctx.globalAlpha = 0.5 * d;
    rect(x0, 70, 76, 71, '#232046');
    ctx.globalAlpha = 1;
  });
  if (SC.clickRooms && S.phase === 'idle' && !S.used) {   // 클릭할 수 있는 층 표시
    const bob = Math.floor(T / 15) % 2;
    ROOM_X.forEach((x0, n) => { if (S.pods.some((p) => p.node === n && p.state === 'run')) ctx.drawImage(SPR.arrow, x0 + 36, 76 + bob); });
  }
  drawGauges();
  drawHearts();

  // 클릭할 수 있는 직원 표시
  if (SC.clickPods && S.phase === 'idle') {
    const bob = Math.floor(T / 15) % 2;
    S.pods.filter((p) => p.state === 'run').forEach((p) => ctx.drawImage(SPR.arrow, p.x + 4, p.feet - 23 + bob));
  }

  // 조는 창구직원
  if (!S.apiAwake) {
    const k = (T % 90) / 90;
    ctx.globalAlpha = 1 - k;
    ctx.drawImage(SPR.zz, 133 + Math.round(k * 4), 38 - Math.round(k * 10));
    ctx.globalAlpha = 1;
  }

  S.rings.forEach(drawRing);
  S.envs.forEach((e) => ctx.drawImage(SPR.env, Math.round(e.x - 3), Math.round(e.y - 2)));
  S.calls.forEach((c) => drawCall(c.pts, c.p));
  S.bangs.forEach((b) => ctx.drawImage(SPR.bang, Math.round(b.x - 2), Math.round(b.y - 14 - (Math.floor(T / 10) % 2))));
  drawEcho();
}

    if (e.rs) return;                                    // 소속 정원표 바로 아래에 붙인다
    rows.push(e);
    if (e.kind === 'rs') rows.push(...S.ledger.filter((q) => q.rs === e.id));
  });
  rows.forEach((e) => {
    let cells;
    if (e.kind === 'node') {
      const r = S.rooms[e.n];
      cells = [{ m: `${ROOMS[e.n].m} 출입 기록`, t: `node/${ROOMS[e.n].t}` }, { m: '-', t: '-' },
        r.unreach ? { m: '연락 두절', t: 'Unknown' } : r.nr ? { m: '일 못 함', t: 'NotReady' }
          : r.cordon ? { m: '배치 금지', t: 'Ready,SchedulingDisabled' } : { m: '정상', t: 'Ready' }];
    } else if (e.kind) {
      cells = ledgerHead(e);
    } else {
      const p = S.pods.find((q) => q.id === e.id);
      const pre = tree ? '\u3000└ ' : '';
      cells = [{ m: pre + p.mn, t: pre + p.tn }, e.node == null ? { m: '-', t: '<none>' } : ROOMS[e.node], stCell(e)];
    }
    const tr = document.createElement('tr');
    if (flash.includes(e.id)) tr.className = 'flash';
    else if (loopFlash.includes(e.id)) tr.className = 'flash-loop';
    cells.forEach((c) => {
      const td = document.createElement('td');
      td.textContent = L(c);
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  flash = [];
}

// 연출 시계. 점검(tests/smoke.cjs)은 ?speed=30 으로 빨리 돌린다 — 평소엔 1
const SPEED = Number(new URLSearchParams(location.search).get('speed')) || 1;
let now = 0, lastTs = null, T = 0;
const tweens = [];
function tween(ms, fn) { return new Promise((res) => tweens.push({ t0: now, ms, fn, res })); }
const wait = (ms) => tween(ms, () => {});
const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2);

async function fly(from, to, ms = 800) {
  S.echo = { k: 'fly', from, to };
  const e = { x: from[0], y: from[1] };
  S.envs.push(e);
  await tween(ms, (p) => {
    const q = ease(p);
    e.x = from[0] + (to[0] - from[0]) * q;
    e.y = from[1] + (to[1] - from[1]) * q - Math.sin(Math.PI * p) * 10;
  });
  S.envs.splice(S.envs.indexOf(e), 1);
}

function hop(a) { S.echo = { k: 'hop', a }; return tween(320, (p) => { a.dy = -Math.round(Math.sin(Math.PI * p) * 3); }); }

function bang(pos, ms = 1500) {
  const b = { x: pos[0], y: pos[1] };
  S.bangs.push(b);
  wait(ms).then(() => { const i = S.bangs.indexOf(b); if (i >= 0) S.bangs.splice(i, 1); });
}

// 창구가 서류를 받는다: 벌떡 일어나 검사 도장
async function receive(full) {
  S.apiAwake = true;
  await wait(250);
  const items = full
    ? [{ m: '신분 ✓', t: '인증 ✓' }, { m: '권한 ✓', t: '인가 ✓' }, { m: '양식 ✓', t: '어드미션 ✓' }]
    : [{ m: '검사 ✓', t: '인증·인가·어드미션 ✓' }];
  const xs = full ? [100, 126, 152] : [126];
  S.echo = { k: 'stamp', items, xs };
  for (let i = 0; i < items.length; i++) {
    bubble(xs[i], 24, items[i], full ? 2600 : 1300, 'ok');
    await wait(full ? 500 : 400);
  }
}

// 장부에 적는다: 서랍이 열리고 표 줄이 반짝
async function record(change) {
  await fly([132, 42], P.drawer(), 450);
  S.drawer = 1;
  const changed = change();
  flash = changed == null ? [] : [].concat(changed);
  S.echo = { k: 'rec', ids: flash.slice() };
  renderLedger();
  await wait(400);
  S.drawer = 0;
}

// 장부가 바뀌었다고 방송(watch) → 듣는 사람 머리 위에 !
async function broadcast(listeners) {
  S.echo = { k: 'ring', listeners };
  const r = { r: 4, a: 1 };
  S.rings.push(r);
  await tween(750, (p) => { r.r = 4 + p * 80; r.a = 1 - p; });
  S.rings.splice(S.rings.indexOf(r), 1);
  listeners.forEach((pos) => bang(pos));
  await wait(500);
}

// 장면 ⑤ 막대: 2층 주인공의 서류(메모리) · 손(CPU) 사용량
const GAUGE = { top: 80, h: 32, xs: { mem: ROOM_X[1] + 44, cpu: ROOM_X[1] + 54 } };
const gaugeY = (v) => GAUGE.top + GAUGE.h - Math.round(v * GAUGE.h);
function drawGauges() {
  const g = S.gauge;
  if (!g) return;
  const { top, h } = GAUGE;
  [['mem', '#8fb8e8'], ['cpu', '#7cc27e']].forEach(([k, col]) => {
    const x = GAUGE.xs[k], v = g[k], fh = Math.round(Math.min(v, 1) * h);
    rect(x - 1, top - 1, 7, h + 2, PALETTE.o); rect(x, top, 5, h, '#f3ecdc');
    let fill = col;
    if (k === 'mem' && v > g.lim + 0.001) fill = T % 20 < 10 ? '#e8434a' : '#ff9a9a';
    if (k === 'cpu' && g.thr) fill = '#f5b93a';
    rect(x, top + h - fh, 5, fh, fill);
    if (k === 'cpu' && g.thr) {               // 쓰로틀링: 칸막이에 막혀 줄무늬
      for (let y = top + h - fh; y < top + h; y++) if ((y + Math.floor(T / 6)) % 4 === 0) rect(x, y, 5, 1, '#c4905a');
    }
    rect(x - 2, gaugeY(g.req), 9, 1, '#4f9a7a');
    rect(x - 2, gaugeY(g.lim), 9, 1, '#e8434a');
  });
}

// 하트비트: 살아 있는 층의 관리자가 주기적으로 ♥ 를 창구로 보낸다
function spawnHearts() {
  ROOM_X.forEach((_, n) => {
    if (S.rooms[n].down || (T + n * 50) % 150) return;
    S.hearts.push({ from: P.kub(n), t0: now });
  });
}
function drawHearts() {
  S.hearts = S.hearts.filter((h) => now - h.t0 < 800);
  S.hearts.forEach((h) => {
    const p = (now - h.t0) / 800, q = ease(p);
    const x = h.from[0] + (126 - h.from[0]) * q, y = h.from[1] + (46 - h.from[1]) * q;
    ctx.globalAlpha = p > 0.8 ? (1 - p) * 5 : 1;
    ctx.drawImage(SPR.heart, Math.round(x - 2), Math.round(y - 2));
    ctx.globalAlpha = 1;
  });
}

// 단계가 끝나고 「다음」을 기다리는 동안 마지막 동작을 반복한다 (자동 재생 중에는 안 함)
let loopFlash = [];
const echoOn = () => S.echo && !busy && !$('auto').checked;
const echoPhase = () => (T % 84) / 84;

function startEcho() {
  const E = S.echo;
  if (!E || $('auto').checked) return;
  if (E.k === 'rec' && E.ids.length) { loopFlash = E.ids; renderLedger(); }
  if (E.k === 'stamp') E.items.forEach((it, i) => bubble(E.xs[i], 24, it, Infinity, 'ok'));
}

function stopEcho() {
  const E = S.echo;
  if (E && E.k === 'hop') E.a.dy = 0;
  if (E && E.k === 'rec') S.drawer = 0;
  S.echo = null;
  if (loopFlash.length) { loopFlash = []; renderLedger(); }
}

function tickEcho() {
  const E = S.echo;
  if (!E || !echoOn()) return;
  const ph = echoPhase();
  if (E.k === 'hop') E.a.dy = ph < 0.4 ? -Math.round(Math.sin((Math.PI * ph) / 0.4) * 3) : 0;
  if (E.k === 'rec') S.drawer = ph < 0.3 ? 1 : 0;
}

function drawEcho() {
  const E = S.echo;
  if (!E || !echoOn()) return;
  const ph = echoPhase();
  if (E.k === 'ring') {
    drawRing({ r: 4 + ph * 80, a: 1 - ph });
    E.listeners.forEach(([x, y]) => ctx.drawImage(SPR.bang, Math.round(x - 2), Math.round(y - 14 - (Math.floor(T / 10) % 2))));
  }
  if (E.k === 'call') drawCall(E.pts, Math.min(1, ph * 1.25));
  if (E.k === 'fly') {
    const q = ease(Math.min(1, ph * 1.25));
    const x = E.from[0] + (E.to[0] - E.from[0]) * q;
    const y = E.from[1] + (E.to[1] - E.from[1]) * q - Math.sin(Math.PI * Math.min(1, ph * 1.25)) * 10;
    ctx.drawImage(SPR.env, Math.round(x - 3), Math.round(y - 2));
  }
}

async function doze() { await wait(300); S.apiAwake = false; }

async function walk(p, toX, ms) {
  const x0 = p.x;
  p.walking = true;
  p.dir = toX < x0 ? 'l' : 'r';
  await tween(ms, (q) => { p.x = x0 + (toX - x0) * q; });
  p.walking = false;
}

// 거르기(필터) → 점수(남는 칸) → 최고점, 동점이면 무작위
function plan2(req) {
  const rooms = ROOM_X.map((_, n) => {
    const r = S.rooms[n], free = 2 - occ(n);
    const why = r.taint && !req.tol ? 'taint' : req.win && !r.win ? 'win' : free < req.size ? 'size' : null;
    return { n, why, tolPass: r.taint && req.tol, score: why ? null : free - req.size };
  });
  const cands = rooms.filter((r) => !r.why);
  const best = Math.max(...cands.map((r) => r.score));
  const top = cands.filter((r) => r.score === best);
  return { req, rooms, cands, target: top.length ? top[Math.floor(rnd() * top.length)].n : null };
}

  bubble(ROOM_X[S.down] + 38, 100, blocked, Infinity, 'no');
  await wait(400);
  for (const f of fs) {
    const free = cnt.map((c, n) => (n === S.down ? -1 : 2 - occ(n) - c));
    const best = Math.max(...free);
    const top = free.map((v, n) => (v === best && v > 0 ? n : -1)).filter((n) => n >= 0);
    const n = top[Math.floor(rnd() * top.length)];
    f.target = n;
    f.desk = freeDesks(n, f)[cnt[n]];
    cnt[n]++;
    bubble(ROOM_X[n] + 38, 100 - (cnt[n] - 1) * 8, { m: `✓ ${f.mn} 배정`, t: `✓ …${f.sfx}` }, Infinity, 'ok');
    await wait(450);
  }
  for (let i = 0; i < fs.length; i++) await fly(P.sch(), P.api(), 450);
  await receive(false);
  await record(() => {
    fs.forEach((f) => { f.node = f.target; Object.assign(entry(f.id), { node: f.target, st: 'crt' }); });
    return fs.map((f) => f.id);
  });
  await broadcast([...new Set(fs.map((f) => f.node))].map((n) => P.kub(n)));
  await doze();
}

async function seat4(oldLeave) {
  const fs = S.fresh3, used = [...new Set(fs.map((f) => f.node))];
  await Promise.all(used.map((n) => hop(S.kub[n])));
  await tween(300, (q) => fs.forEach((f) => { f.alpha = 1 - q; }));
  fs.forEach((f) => Object.assign(f, { x: ROOM_X[f.node] + 62, feet: DESK_FEET, state: 'run', alpha: 1 }));
  await Promise.all(fs.map((f) => walk(f, deskX(f.node, f.desk), 1200)));
  fs.forEach((f) => { f.dir = 'r'; });
  await wait(200);
  await Promise.all(used.map((n, i) => wait(i * 150).then(() => fly(P.kub(n), P.api(), 900))));
  await receive(false);
  await record(() => { fs.forEach((f) => { entry(f.id).st = 'run'; }); return fs.map((f) => f.id); });
  await doze();
  if (oldLeave) {                   // 연락이 되는 층: 기존 직원이 정리 후 나가고 장부에서 지워짐
    const vs = S.victims;
    await Promise.all(vs.map((v) => walk(v, ROOM_X[v.node] + 62, 1000)));
    await tween(400, (q) => vs.forEach((v) => { v.alpha = 1 - q; }));
    vs.forEach((v) => { v.state = 'gone'; });
    await fly(P.kub(S.down), P.api(), 900);
    await receive(false);
    await record(() => { S.ledger = S.ledger.filter((e) => !vs.some((v) => v.id === e.id)); return null; });
    await doze();
    S.pods = S.pods.filter((p) => p.state !== 'gone');
  }
  bubble(S.A.rs.x + 6, 26, { m: '원함 3 / 실제 3 ✓', t: 'spec 3 / 실제 3 ✓' }, Infinity, 'ok');
}

// 퇴사 처리(축출): 장부에 퇴사 예정 → 정원 담당(과 연락되면 층 관리자)에게 방송
async function evict4(from, packing) {
  const n = S.down, vs = S.pods.filter((p) => p.node === n && p.state === 'run');
  S.victims = vs;
  await fly(from, P.api(), 900);
  await receive(false);
  vs.forEach((v) => { v.state = 'term'; v.box = packing; });
  await record(() => { vs.forEach((v) => { entry(v.id).st = 'term'; }); return vs.map((v) => v.id); });
  await broadcast(packing ? [P.kub(n), P.rs()] : [P.rs()]);
  await doze();
}

function freestRoom() {   // 가장 비어 있는 층, 같으면 무작위
  const free = ROOM_X.map((_, n) => 2 - occ(n));
  const best = Math.max(...free);
  const top = free.map((v, n) => (v === best ? n : -1)).filter((n) => n >= 0);
  return top[Math.floor(rnd() * top.length)];
}
function pickVictim(v) {  // 같은 층에 팀원이 많은 쪽부터, 같으면 무작위
  const vs = VERS(v), cnt = (p) => S.pods.filter((q) => q.node === p.node && seated(q)).length;
  const best = Math.max(...vs.map(cnt));
  const top = vs.filter((p) => cnt(p) === best);
  return top[Math.floor(rnd() * top.length)];
}

async function dial({ avoid, prefer } = {}) {   // ☎900 → 거는 사람 층의 교환기 → 규칙대로 1명
  const c = S.caller, rules = S.rules[c.node];
  let cand = prefer != null && rules.includes(prefer) ? [prefer] : rules.filter((id) => id !== avoid);
  if (!cand.length) cand = rules;
  const pick = cand[Math.floor(rnd() * cand.length)];   // 먼저 뽑고 찾는다 (find 안에서 뽑으면 직원마다 다시 뽑힘)
  const t = S.pods.find((p) => p.id === pick);
  bubble(...podTop(c), { m: '☎900 걸기', t: '→ 10.96.0.15' }, Infinity);
  await phone([podTop(c), P.sb(c.node)], 500);
  bubble(ROOM_X[c.node] + 51, 76, { m: `→ ☎${t.ext}`, t: `→ ${t.ip}` }, Infinity, 'ok');
  await wait(350);
  await phone([P.sb(c.node), podTop(t)], 800);
  bubble(...podTop(t), { m: '여보세요 ✓', t: '200 OK' }, Infinity, 'ok');
  await wait(700);
  return t;
}

let SC = SCENE1;

// ===== 8. 진행 =====

let cur = 0, busy = false;
const $ = (id) => document.getElementById(id);

function say(i) {
  const steps = SC.steps(), s = steps[i];
  $('lines').innerHTML = '';
  s[MODE].forEach((line) => { const p = document.createElement('p'); p.textContent = line; $('lines').appendChild(p); });
  $('clock').textContent = s.clock ? `⏱ ${s.clock}` : '';
  $('refText').textContent = s.ref;
  $('refLink').href = s.url;
  $('refLink').textContent = s.url.replace('https://', '');
  $('count').textContent = i === 0 ? '' : `${i} / ${steps.length - 1}`;
}

const lastStep = () => SC.steps().length - 1;

function updBtns() {
  $('next').disabled = busy || cur === 0 || cur >= lastStep();
  $('replay').disabled = cur === 0;
}

// 장면 ② 처럼 고르는 장면: 기다리는 동안 선택 칩을 보여 준다
function renderChoices() {
  const box = $('choices');
  box.innerHTML = '';
  if (!SC.choices || S.phase !== 'idle') return;
  SC.choices.forEach((c) => {
    const b = document.createElement('button');
    b.dataset.m = c.m; b.dataset.t = c.t;
    b.textContent = L(c);
    b.addEventListener('click', () => choose(c));
    box.appendChild(b);
  });
}

function choose(c) {
  if (S.phase !== 'idle') return;
  if (S.used) reset();
  S.used = true;
  S.plan = SC.plan(c);
  S.plan.choice = { m: c.m, t: c.t };
  S.phase = 'run';
  renderChoices();
  runStep(1);
}

async function runStep(i) {
  const g = gen;
  cur = i;
  say(i);
  stopEcho();
  clearBubbles();
  snap = { S: structuredClone(S), seed, podSeq, keeps: bubbles.filter((b) => b.keep).map((b) => b.args) };
  busy = true; updBtns();
  await SC.run[i]();
  if (g !== gen) return;
  busy = false;
  startEcho();
  if (i === lastStep()) { S.phase = 'idle'; updBtns(); renderChoices(); return; }
  updBtns();
  if ($('auto').checked) {
    await wait(1500);
    if (g === gen && cur === i && !busy) next();
  }
}

function next() { if (!busy && cur >= 1 && cur < lastStep()) runStep(cur + 1); }

// 다시보기: 단계를 시작할 때 찍어 둔 상태로 돌려 같은 단계를 다시 돈다 (진행 중이어도 됨)
let snap = null;
function replay() {
  if (!snap || cur < 1) return;
  gen++;
  tweens.length = 0;
  clearBubbles(true);
  podTags.forEach((el) => el.remove()); podTags.clear();
  loopFlash = []; flash = [];
  S = structuredClone(snap.S); seed = snap.seed; podSeq = snap.podSeq;
  snap.keeps.forEach((a) => bubble(...a));
  refreshRoomTags();
  renderLedger();
  renderChoices();
  runStep(cur);
}

function reset() {
  gen++;
  tweens.length = 0;
  clearBubbles(true);
  podTags.forEach((el) => el.remove()); podTags.clear();
  loopFlash = [];
  initState();
  refreshRoomTags();
  Object.assign($('lrs').dataset, SC.sub);
  $('lrs').textContent = L(SC.sub);
  renderLedger();
  cur = 0; busy = false; snap = null;
  say(0); updBtns(); renderChoices();
}

function podAt(x, y) {
  if (!SC.clickPods) return null;
  const pad = cv.clientWidth < 700 ? 4 : 0;   // 폰: 손가락으로 누르기 쉽게 (옆 책상과는 24 떨어져 안 겹침)
  return S.pods.find((p) => p.state === 'run' && x >= p.x - pad && x < p.x + 12 + pad && y >= p.feet - 17 - pad && y <= p.feet + pad);
}
function roomAt(x, y) {
  if (!SC.clickRooms || S.phase !== 'idle' || S.used) return null;
  const n = ROOM_X.findIndex((x0) => x >= x0 && x < x0 + 76 && y >= 69 && y <= 141);
  return n >= 0 && S.pods.some((p) => p.node === n && p.state === 'run') ? n : null;
}
function clickRoom(n) {
  if (n == null || S.phase !== 'idle' || S.used) return;   // 한 판에 한 층
  S.used = true;
  S.phase = 'run';
  S.down = n;
  runStep(1);
}
function toCanvas(e) { return [(e.offsetX / cv.clientWidth) * W, (e.offsetY / cv.clientHeight) * H]; }

function clickPod(p) {
  if (S.phase !== 'idle' || !p || p.state !== 'run') return;
  clearBubbles();
  S.phase = 'run';
  S.victim = p;
  S.fresh = null;
  runStep(1);
}

cv.addEventListener('click', (e) => {
  const [x, y] = toCanvas(e);
  if (SC.clickRooms) clickRoom(roomAt(x, y)); else clickPod(podAt(x, y));
});
cv.addEventListener('mousemove', (e) => {
  const [x, y] = toCanvas(e);
  cv.style.cursor = S.phase === 'idle' && (podAt(x, y) || roomAt(x, y) != null) ? 'pointer' : 'default';
});
$('next').addEventListener('click', next);
$('replay').addEventListener('click', replay);
$('reset').addEventListener('click', reset);
$('auto').addEventListener('change', () => {
  if ($('auto').checked) { if (loopFlash.length) { loopFlash = []; renderLedger(); } next(); } else if (!busy) startEcho();
});

  MODE = m;

// ===== 10. 루프 =====

function frame(ts) {
  now += lastTs == null ? 0 : (ts - lastTs) * SPEED; lastTs = ts; T++;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i];
    const p = Math.min(1, (now - w.t0) / w.ms);
    w.fn(p);
    if (p >= 1) { tweens.splice(i, 1); w.res(); }
  }
  bubbles = bubbles.filter((b) => { if (now > b.until) { b.d.remove(); return false; } return true; });
  if (SC.heartbeat) spawnHearts();
  tickEcho();
  draw();
  updateTags();
  requestAnimationFrame(frame);
}

// 작은 도트 그림: r(x, y, w, h, 색) 으로 칠한다
function pix(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  fn((x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(x, y, ww, hh); }, g);
  return c;
}

    d: '새 직원을 보내지 않는다는 표시(파란 줄무늬). 있던 직원은 그대로 일함.' },
  { g: '표시·상태', m: '예약 크기', t: 'requests', art: () => gauge('#4f9a7a', 8), sc: [5],
    d: '직원이 쓰겠다고 예약한 양(초록 줄). 자리배치 담당은 이 값만 보고 층을 정함.' },
  { g: '표시·상태', m: '칸막이', t: 'limits', art: () => gauge('#e8434a', 4), sc: [5],
    d: '넘을 수 없는 한도(빨간 줄). 서류(메모리)가 넘치면 쓰러지고, 손(CPU)이 넘치면 느려지기만 함.' },
  { g: '표시·상태', m: '쓰러짐', t: 'OOMKilled', art: () => lying(false), sc: [5],
    d: '메모리 한도를 넘겨 컨테이너가 강제로 끝남. 퇴사가 아니라 같은 자리에서 다시 일어남.' },
  { g: '표시·상태', m: '재시작 대기', t: 'CrashLoopBackOff', art: () => lying(true), sc: [5],
    d: '계속 쓰러지면 다시 일으키기 전 기다림이 10→20→40초… 로 늘어남. 최대 5분.' },
  { g: '표시·상태', m: '출근 확인', t: 'startup probe', art: () => withMark(stand(SPR.emp[3]), CHECK, 17, 3), sc: [6],
    d: '처음 일을 시작했는지 확인함. 이게 끝나기 전엔 다른 확인을 안 함.' },
  { g: '표시·상태', m: '"괜찮나?"', t: 'liveness probe', art: () => withMark(stand(SPR.empSleep[4]), QM('#e8434a')), sc: [6],
    d: '멍해져 답이 없으면(3번 실패) 다시 깨움 = 컨테이너 재시작.' },
  { g: '표시·상태', m: '"준비 됐나?"', t: 'readiness probe', art: () => withMark(stand(SPR.emp[5]), QM('#4f9a7a')), sc: [6, 7],
    d: '바빠서 준비 안 됐다고 하면 새 일(전화)만 안 보냄. 재시작은 안 함.' },
  { g: '표시·상태', m: '진행 실패', t: 'ProgressDeadlineExceeded', sc: [6],
    art: () => pix(13, 13, (r) => { r(1, 1, 11, 11, '#e8434a'); r(2, 2, 9, 9, '#fffdf5'); r(6, 3, 1, 4, O_); r(6, 6, 3, 1, O_); }),
    d: '정해진 시간(기본 10분) 안에 교체가 안 끝남. 기록만 하고 자동으로 되돌리지 않음.' },

    art: () => pix(22, 12, (r) => { book(r, 0, 1, VER_COL.v1); book(r, 18, 1, VER_COL.v3); r(7, 6, 8, 1, O_); r(8, 5, 1, 3, O_); r(9, 4, 1, 5, O_); }),
    d: '옛 정원표를 다시 늘려 이전 매뉴얼로 돌아감.' },
];

const CIRC = '①②③④⑤⑥⑦';
const DEX_GROUPS = ['사람', '장소·물건', '표시·상태'];
let spyHold = 0;
const dexNavOn = (i) => [...$('dexNav').children].forEach((b, k) => b.classList.toggle('on', k === i));
function dexSpy() {   // 머리 바로 아래를 지난 마지막 묶음을 켬. 맨 끝이면 마지막 묶음
  if (screen !== 'dex' || performance.now() < spyHold) return;
  const line = $('dex').querySelector('.dexhead').getBoundingClientRect().bottom + 8;
  const hs = [...$('dexBody').querySelectorAll('h3')];
  let on = 0;
  hs.forEach((h, k) => { if (h.getBoundingClientRect().top <= line) on = k; });
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) on = hs.length - 1;
  dexNavOn(on);
}
window.addEventListener('scroll', dexSpy, { passive: true });
function dexArt(src) {   // 24x20 칸 가운데에. 작은 그림은 두 배로
  const c = document.createElement('canvas');
  c.width = 24; c.height = 20;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  const k = src.width * 2 <= 24 && src.height * 2 <= 20 ? 2 : 1;
  const w = src.width * k, h = src.height * k;
  g.drawImage(src, Math.floor((24 - w) / 2), Math.floor((20 - h) / 2), w, h);
  return c;
}
function openScene(n) {
  if (SC !== SCENES[n - 1].sc) switchScene(SCENES[n - 1].sc);
  show('sim');
}
function renderDex() {
  const box = $('dexBody');
  box.innerHTML = '';
  $('dexNav').innerHTML = '';
  DEX_GROUPS.forEach((grp, i) => {
    const h = document.createElement('h3');
    h.textContent = grp;
    box.appendChild(h);
    const nb = document.createElement('button');
    nb.textContent = grp;
    nb.addEventListener('click', () => {
      spyHold = performance.now() + 900;   // 부드럽게 내려가는 동안 중간 묶음이 켜지지 않게
      dexNavOn(i);
      window.scrollTo({ top: h.getBoundingClientRect().top + window.scrollY - $('dex').querySelector('.dexhead').offsetHeight - 4, behavior: 'smooth' });
    });
    $('dexNav').appendChild(nb);
    const list = document.createElement('div');
    list.className = 'dexlist';
    DEX.filter((e) => e.g === grp).forEach((e) => {
      const it = document.createElement('div');
      it.className = 'dexit';
      const art = dexArt(e.art());
      art.className = 'art';
      it.appendChild(art);
      const tx = document.createElement('div');
      const add = (cls, text) => { const d = document.createElement('div'); d.className = cls; d.textContent = text; tx.appendChild(d); return d; };
      add('nm', e.m);
      add('tm', e.t);
      add('ds', e.d);
      const scs = add('scs', e.sc === ALL ? '모든 장면' : '나오는 장면');
      if (e.sc !== ALL) e.sc.forEach((n) => {
        const b = document.createElement('button');
        b.textContent = CIRC[n - 1];
        b.title = SCENES[n - 1].m;
        b.addEventListener('click', () => openScene(n));
        scs.appendChild(b);
      });
      it.appendChild(tx);
      list.appendChild(it);
    });
    box.appendChild(list);
  });
  $('dexCount').textContent = `용어 ${DEX.length}개`;
}

$('startSub').textContent = `장면 ${SCENES.length}개`;
$('dexSub').textContent = `용어 ${DEX.length}개`;
$('goStart').addEventListener('click', () => show('sim'));
$('goDex').addEventListener('click', () => { dexFrom = 'home'; show('dex'); });
$('toDex').addEventListener('click', () => { dexFrom = 'sim'; show('dex'); });
$('toHome').addEventListener('click', () => show('home'));
$('dexBack').addEventListener('click', () => show(dexFrom));
drawTitle();
renderDex();

reset();
setMode('m');
requestAnimationFrame(frame);

window.sim = {
  get S() { return S; }, setMode, next, replay, reset, clickPod, choose, CHOICES2,
  scene: (i) => { show('sim'); switchScene(SCENES[i - 1].sc); }, show, get screen() { return screen; }, DEX,
  get cur() { return cur; }, get busy() { return busy; },
  get last() { return lastStep(); }, set seed(v) { seed = v | 0; },   // 점검용
};
</script>

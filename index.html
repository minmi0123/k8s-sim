<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쿠버네티스 회사 — 장면으로 보는 k8s</title>
<link rel="stylesheet" href="engine/sim.css">
</head>
<body>
<div id="home" class="screen">
  <h2 class="ttl">쿠버네티스 회사</h2>
  <div class="tagline">장면으로 보는 쿠버네티스</div>
  <canvas id="titleCv" width="160" height="120"></canvas>
  <div class="menu">
    <button id="goStart" class="main">시작하기<span class="s" id="startSub"></span></button>
    <button id="goDex">도감<span class="s" id="dexSub"></span></button>
  </div>
</div>

<div id="dex" class="screen" hidden>
  <div class="dexhead">
    <div class="row"><button id="dexBack">← 돌아가기</button><h2>용어 도감</h2><span class="cnt" id="dexCount"></span></div>
    <div class="dexnav" id="dexNav"></div>
  </div>
  <div id="dexBody"></div>
</div>

<div class="wrap" id="simScreen" hidden>
  <header>
    <h1>쿠버네티스 회사</h1>
    <div class="scenes" id="scenes"></div>
    <div class="nav">
      <button id="toHome" title="처음 화면">⌂ 처음</button>
      <button id="toDex">도감</button>
    </div>
    <div class="mode" id="mode">
      <button data-mode="m" class="on">비유</button>
      <button data-mode="t">용어</button>
    </div>
  </header>

  <div class="stage" id="stage"><canvas id="cv" width="256" height="144"></canvas></div>

  <div class="ctrl">
    <button id="reset">처음부터</button>
    <button id="next" class="main">다음 ▶</button>
    <button id="replay" title="지금 단계를 처음부터 다시 봄">↺ 다시보기</button>
    <label><input type="checkbox" id="auto"> 자동 재생</label>
    <span class="count" id="count"></span>
  </div>

  <div class="panel">
    <div class="say">
      <div id="lines"></div>
      <div id="choices" class="choices"></div>
      <div class="meta">
        <span id="clock"></span>
        <details id="ref"><summary>근거</summary><p id="refText"></p><p><a id="refLink" target="_blank" rel="noopener"></a></p></details>
      </div>
    </div>
    <div class="ledger">
      <div class="lh" data-m="장부" data-t="etcd"></div>
      <div class="lrs" id="lrs"></div>
      <table><thead><tr><th data-m="이름" data-t="NAME"></th><th data-m="층" data-t="NODE"></th><th data-m="상태" data-t="STATUS"></th></tr></thead><tbody id="lt"></tbody></table>
    </div>
  </div>
</div>

<!-- 엔진 (다른 게임에도 그대로 씀) -->
<script src="engine/core.js"></script>
<script src="engine/sprite.js"></script>
<script src="engine/stage.js"></script>
<script src="engine/runner.js"></script>
<script src="engine/screens.js"></script>
<!-- 이 게임: 쿠버네티스 회사 -->
<script src="games/k8s/world.js"></script>
<script src="games/k8s/acts.js"></script>
<script src="games/k8s/scene1.js"></script>
<script src="games/k8s/scene2.js"></script>
<script src="games/k8s/scene3.js"></script>
<script src="games/k8s/scene4.js"></script>
<script src="games/k8s/scene5.js"></script>
<script src="games/k8s/scene6.js"></script>
<script src="games/k8s/scene7.js"></script>
<script src="games/k8s/dex.js"></script>
<script src="games/k8s/main.js"></script>
</body>
</html>
